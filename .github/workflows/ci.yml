name: DevSecOps Production CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-test:
    name: Compilación, Tests ACID y Auditoría SBOM
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: security_ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache de dependencias Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Aplicar migraciones SQL
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/security_ledger
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          if [ -d "migrations" ]; then
            for f in $(ls migrations/*.sql | sort); do
              echo "Aplicando migración: $f"
              PGPASSWORD=postgrespassword psql -h localhost -U postgres -d security_ledger -f "$f"
            done
          fi

      - name: Ejecutar pruebas y compilación Rust
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/security_ledger
        run: |
          cargo check --all-targets --all-features
          cargo test --all-targets --all-features -- --nocapture

      - name: Validar integridad de artefactos de auditoría
        run: |
          test -f sbom-cyclonedx.json
          test -f THIRD-PARTY-NOTICES.txt
          test -f references/BARTER_TAX_ANNEX.md
